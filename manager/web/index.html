<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Aurora Skin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CODEX AURORA SKIN</p>
      <h1>主题资源库</h1>
      <p class="subtitle">离线管理背景、浅暗参数与界面底色，不修改 Codex 官方安装包。</p>
    </div>
    <div class="session-box">
      <span id="session-dot" class="status-dot"></span>
      <span id="session-text">正在检查 Codex…</span>
      <button id="start-session" type="button" class="secondary">启动主题会话</button>
      <button id="restore-session" type="button" class="danger-ghost">恢复官方外观</button>
    </div>
  </header>

  <main>
    <section class="library-panel">
      <div class="section-heading">
        <div>
          <h2>选择主题</h2>
          <p>内置主题只读；导入的图片保存在本机用户目录。</p>
        </div>
        <label class="import-button">
          导入图片
          <input id="import-file" type="file" accept="image/png,image/jpeg,image/webp">
        </label>
      </div>
      <div id="theme-sections"></div>
    </section>

    <aside class="editor-panel">
      <div id="empty-editor" class="empty-state">从资源库中选择一个主题。</div>
      <div id="theme-editor" hidden>
        <div class="preview" id="preview">
          <img id="preview-image" alt="">
          <div id="preview-overlay"></div>
          <span id="active-badge" class="active-badge" hidden>正在使用</span>
        </div>

        <div class="theme-title-row">
          <div>
            <p id="theme-source" class="eyebrow"></p>
            <h2 id="theme-name"></h2>
          </div>
          <div id="user-actions" class="compact-actions" hidden>
            <button id="rename-theme" type="button" class="ghost">重命名</button>
            <button id="delete-theme" type="button" class="danger-ghost">删除</button>
          </div>
        </div>

        <div class="mode-tabs" role="tablist" aria-label="外观模式">
          <button type="button" data-mode="light" class="mode-tab active">浅色外观</button>
          <button type="button" data-mode="dark" class="mode-tab">暗色外观</button>
        </div>

        <div class="control">
          <label for="brightness">
            <span>图片亮度</span>
            <output id="brightness-value">90%</output>
          </label>
          <input id="brightness" type="range" min="0.35" max="1.2" step="0.01">
        </div>
        <div class="control">
          <label for="overlay">
            <span>背景压暗程度</span>
            <output id="overlay-value">12%</output>
          </label>
          <input id="overlay" type="range" min="0" max="0.7" step="0.01">
        </div>
        <div class="control">
          <label for="surface">
            <span>界面底色强度</span>
            <output id="surface-value">65%</output>
          </label>
          <input id="surface" type="range" min="0.2" max="1" step="0.01">
        </div>

        <div class="editor-actions">
          <button id="reset-visual" type="button" class="secondary">恢复主题默认值</button>
          <button id="apply-theme" type="button" class="primary">应用主题</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
